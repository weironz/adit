[package]
name = "adit-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
adit-domain.workspace = true
# For `Quality` only. The wire enum is reused as the persisted one on purpose:
# a settings-local copy would be a second list to keep in step with the helper's,
# and the first time they disagreed a saved preset would silently connect at a
# different one. adit-rdp-proto carries nothing but serde + bincode, so this
# does not drag anything into the dependency graph.
adit-rdp-proto.workspace = true
keyring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chacha20poly1305.workspace = true
argon2.workspace = true
hex.workspace = true
zeroize.workspace = true
