<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    Alpine: two white peaks on the distribution's navy.

    Navy disc rather than a navy mountain on nothing, because #0D597F against
    the dark theme's #15161E is nearly the same value — the shape would be
    there and invisible. White on navy carries in both modes.

    Big peak  apex (52,34), feet (22,96) and (82,96).
    Small peak apex (86,58), feet (68,96) and (106,96).
    The two overlap, and where the big peak's right slope crosses the small
    peak's left slope is the valley between them: solving
      (52,34)->(82,96)  against  (68,96)->(86,58)
    gives (75,81), which is the notch you see. Move either apex and that notch
    moves with it — that is the whole silhouette, so check it before nudging.

    Farthest point from centre is a foot at (22,96): hypot(42,32) = 52.8, which
    clears the r=64 disc with room for the antialiased edge.
  -->
  <circle cx="64" cy="64" r="64" fill="#0D597F"/>
  <g fill="#ffffff">
    <path d="M52 34 L82 96 L22 96 Z"/>
    <path d="M86 58 L106 96 L68 96 Z"/>
  </g>
</svg>
