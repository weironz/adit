[package]
name = "adit-rdp"
version = "0.1.63"
edition = "2021"
authors = ["Adit"]
license = "MIT"

# Standalone workspace: adit-rdp is deliberately excluded from the main Adit
# workspace because the IronRDP stack's `picky` crate exact-pins pre-release
# RustCrypto versions that conflict with russh's. Keeping a separate Cargo.lock
# lets IronRDP and russh each resolve their own crypto deps. adit-rdp ships as a
# helper process the main app drives over IPC.
[workspace]

[lib]
name = "adit_rdp"
path = "src/lib.rs"

# The helper executable the main app spawns and drives over stdin/stdout.
[[bin]]
name = "adit-rdp-host"
path = "src/main.rs"

[features]
# Core (connect + render + input + resize) ships by default.
default = []
# Server audio playback (RDPSND) through cpal. Off by default because it pulls
# native Opus (libopus_sys), which needs a CMake toolchain.
sound = ["dep:ironrdp-rdpsnd", "dep:ironrdp-rdpsnd-native"]

# NOTE: there is deliberately no `clipboard` feature — CLIPRDR ships unconditionally
# and is gated at runtime by `ConnectRequest::enable_clipboard`. It costs nothing to
# link: `ironrdp-cliprdr` is pure protocol code with no OS dependency, because we do
# NOT use `ironrdp-cliprdr-native`. That crate's Windows backend owns the real system
# clipboard and therefore needs a window and a message pump, which this windowless
# helper does not have. Instead the GUI app owns the Windows clipboard and this helper
# only speaks the wire protocol; see the module docs in `src/clipboard.rs`.

[dependencies]
adit-rdp-proto = { path = "../adit-rdp-proto" }
# IronRDP protocol stack (pinned to the published crates.io releases).
ironrdp-core = { version = "0.2", features = ["alloc"] }
ironrdp-pdu = "0.9"
ironrdp-svc = "0.8"
ironrdp-dvc = "0.8"
ironrdp-cliprdr = "0.7"
ironrdp-connector = "0.10"
ironrdp-session = "0.11"
ironrdp-graphics = "0.9"
ironrdp-input = "0.7"
ironrdp-displaycontrol = "0.8"
# `openh264-bundled` compiles Cisco's OpenH264 from source at build time and
# unlocks ironrdp-egfx's built-in AVC420 decode path (H.264 negotiated with the
# server instead of the RemoteFX-Progressive tile fallback). Swappable later
# for a Windows Media Foundation implementation of the same `H264Decoder`
# trait if hardware decode is wanted.
ironrdp-egfx = { version = "0.3", features = ["openh264-bundled"] }
# Direct dependency for the AVC444 module: the auxiliary chroma view needs the
# raw YUV planes, which ironrdp-egfx's RGBA-only decoder trait cannot expose.
openh264 = "0.9"
ironrdp-async = "0.10"
ironrdp-tokio = { version = "0.10", features = ["reqwest"] }
ironrdp-tls = { version = "0.2", features = ["rustls"] }
ironrdp-rdpsnd = { version = "0.9", optional = true }
ironrdp-rdpsnd-native = { version = "0.7", optional = true }

sspi = "0.21"
smallvec = "1.15"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "net", "macros"] }
tracing = "0.1"
# Diagnostics go to STDERR only (stdout is the binary protocol). Off unless
# RUST_LOG is set, so normal runs stay silent.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Vendored + patched ironrdp-connector (crates.io 0.10.0 + three marked hunks):
# RDSTLS on the GNOME handover redirect, EGFX capability advertisement, and
# dropping the MCS message channel to dodge a connect-time deadlock. Byte-for-byte
# identical to upstream otherwise. Full rationale + re-vendoring steps in
# IRONRDP-PATCHES.md; each hunk is tagged `ADIT PATCH` in
# vendor/ironrdp-connector/src/connection.rs.
[dev-dependencies]
# Only for the offline progressive replay: a decoded frame has to be LOOKED at.
image = { version = "0.25", default-features = false, features = ["png"] }

[patch.crates-io]
ironrdp-connector = { path = "vendor/ironrdp-connector" }
# Vendored + patched ironrdp-graphics (crates.io 0.9.0 + one marked hunk):
# RemoteFX Progressive treats a tile `quality` of 0xFF as an index into
# quantProgVals, but MS-RDPRFX 2.2.4.3.6 defines it as "losslessly encoded, no
# progressive quantization". Windows sends 0xFF with numProgQuant 0, so every
# tile failed to decode and the desktop rendered as coloured garbage.
ironrdp-graphics = { path = "vendor/ironrdp-graphics" }
# Vendored + patched ironrdp-pdu (crates.io 0.9.0 + ClearCodec hunks):
# SHORT_VBAR_CACHE_MISS reads its two fields from transposed bit ranges, and
# the RLEX segment parse special-cases a one-entry palette in a way FreeRDP
# does not. Between them they rejected almost every ClearCodec PDU a real
# Windows host sends.
ironrdp-pdu = { path = "vendor/ironrdp-pdu" }
