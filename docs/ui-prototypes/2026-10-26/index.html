<body>
<main class="review">
 <header class="review-top">
  <div class="review-title"><div class="eyebrow">ADIT / INTERFACE STUDIES</div><h1>让连接有秩序，让工作区安静</h1></div>
  <nav class="variant-switch" aria-label="原型方案">
   <button data-variant="a" aria-pressed="true"><b>A</b>资源与工作分离</button>
   <button data-variant="b" aria-pressed="false"><b>B</b>连接树与有限标签</button>
   <button data-variant="c" aria-pressed="false"><b>C</b>任务工作区与分屏</button>
  </nav>
  <div class="review-tools">
   <label class="state-label" for="demo-state">状态</label>
   <select id="demo-state" aria-label="原型内容状态"><option value="normal">正常连接</option><option value="loading">连接中</option><option value="error">连接错误</option><option value="empty">无打开会话</option><option value="partial">部分连接失败</option><option value="readonly">只读模式</option></select>
   <button id="theme-toggle" aria-label="切换明暗主题">深色</button>
   <button id="density-toggle" class="density-toggle" aria-pressed="false">紧凑密度</button>
  </div>
 </header>
 <section class="variant-note" aria-live="polite"><h2 id="variant-title"></h2><p id="variant-description"></p></section>
 <section id="app" class="app" data-theme="light" aria-label="Adit 交互原型"></section>
 <footer class="review-footer"><span>交互原型 · 24 台合成主机 / 12 个打开会话</span><span class="foot-note">点击主机切换 · Ctrl K 查找 · Esc 返回 · 不连接真实主机</span><span class="spacer"></span><a href="references.html" target="_blank" rel="noopener">参考与方案取舍 ↗</a></footer>
</main>
<script>
'use strict';
const paths={
 logo:'M3 3h12v12H3z M7 3v12 M7 9h8',
 terminal:'m4 5 4 4-4 4 M11 13h5',
 desktop:'M2 3h16v11H2z M7 18h6 M10 14v4',
 library:'M3 2v16 M7 2v16 M11 3l4-1 4 15-4 1z',
 grid:'M2 2h6v6H2z M12 2h6v6h-6z M2 12h6v6H2z M12 12h6v6h-6z',
 folder:'M2 5h6l2-2h8v14H2z',
 plus:'M10 3v14 M3 10h14',
 search:'M14 14l4 4 M15 8a6 6 0 1 1-12 0 6 6 0 0 1 12 0',

 settings:'M10 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M10 1v2 M10 17v2 M1 10h2 M17 10h2 M4 4l1 1 M15 15l1 1 M4 16l1-1 M15 5l1-1',
 exit:'M8 3H2v14h6 M7 10h11 M14 6l4 4-4 4',
 refresh:'M17 7a7 7 0 1 0 0 6 M17 2v5h-5',

 check:'m4 10 4 4L17 5',
 alert:'M10 2 19 18H1z M10 7v5 M10 15v.1',
 key:'M12 6a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M11 9l7 7 M14 12l-2 2 M17 15l-2 2',
 file:'M4 1h8l5 5v13H4z M12 1v5h5 M7 10h7 M7 14h7',
 sun:'M14 10a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M10 1v2 M10 17v2 M1 10h2 M17 10h2 M4 4l1 1 M15 15l1 1',
 pin:'M6 2h8 M7 2v5l-3 4h12l-3-4V2 M10 11v7',
 back:'M17 10H3 m5-5-5 5 5 5'
};
const icon=(name)=>`<svg viewBox="0 0 20 20" aria-hidden="true"><path d="${paths[name]||paths.terminal}"/></svg>`;
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groupNames=['生产环境','测试环境','基础设施'];
const hostNames=['prod-api-01','prod-api-02','prod-db-primary','prod-db-replica','prod-nginx-01','prod-redis-01','staging-api-01','staging-db-01','win-build-01','ubuntu-dev-01','edge-gateway-01','monitoring-01','prod-worker-01','prod-worker-02','prod-backup-01','prod-vault-01','test-redis-01','test-k8s-01','test-k8s-02','win-desktop-02','nas-storage-01','vpn-gateway-01','dns-internal-01','log-collector-01'];
const hosts=hostNames.map((name,i)=>({id:i+1,name,host:`10.${i<6||i>=12&&i<16?20:i<10||i>=16&&i<20?30:40}.0.${11+i}`,user:i===8||i===19?'operator':'ops',protocol:i===8?'VNC':i===19?'RDP':'SSH',group:i<6||i>=12&&i<16?0:i<10||i>=16&&i<20?1:2}));
const tasks=[
 {id:'incident',name:'API 延迟排查',note:'生产环境 · 4 个会话',description:'应用、网关与远程桌面放在同一个排障上下文中',ids:[1,2,5,9],mark:'01'},
 {id:'database',name:'数据库巡检',note:'生产环境 · 3 个会话',description:'主库、从库与缓存的日常检查',ids:[3,4,6],mark:'02'},
 {id:'daily',name:'日常维护',note:'测试与基础设施 · 5 个会话',description:'构建、测试与基础设施维护',ids:[7,8,10,11,12],mark:'03'}
];
const modes={
 a:{title:'资源归资源，会话归会话',desc:'工作区侧栏只显示打开会话；切到资源库后，侧栏只显示分组，右侧才是主机列表。',recommend:true},
 b:{title:'熟悉的连接树，收敛的顶部标签',desc:'主机树是唯一资源入口；顶部最多 3 个标签，其余连接放进切换器，保持在线。'},
 c:{title:'围绕任务组织，多台主机一起看',desc:'侧栏只列任务工作区；会话在主区域分屏，不再给每个连接分配一个顶部标签。'}
};
const state={mode:'a',theme:'light',compact:false,location:'workspace',active:1,open:hosts.slice(0,12).map(h=>h.id),pinned:[1,3],group:-1,task:'incident',focusPane:1,singlePane:false,sidebar:true,demo:'normal',sideQuery:'',catalogQuery:'',modal:null,paletteQuery:'',paletteIndex:0,returnFocus:null,toast:null,outputs:{}};
const app=document.querySelector('#app');
const narrowQuery=window.matchMedia('(max-width:600px)');
state.sidebar=!narrowQuery.matches;
narrowQuery.addEventListener('change',e=>{state.sidebar=!e.matches;render()});
const byId=id=>hosts.find(h=>h.id===Number(id))||hosts[0];
const opened=()=>state.open.map(byId);
const active=()=>byId(state.active);
const currentTask=()=>tasks.find(t=>t.id===state.task);
const appButton=(name,label,action,extra='')=>`<button class="ico-btn ${extra}" title="${esc(label)}" aria-label="${esc(label)}" data-action="${action}">${icon(name)}</button>`;
const proto=h=>`<span class="proto-icon ${h.protocol==='SSH'?'':'desktop'}">${icon(h.protocol==='SSH'?'terminal':'desktop')}</span>`;
const connectionDot=h=>`<span class="dot ${state.demo==='partial'&&h.id===3?'error':''}" aria-hidden="true"></span>`;
function titleBar(){return `<div class="titlebar"><span class="logo">${icon('logo')}</span><span class="brand">adit</span><span class="window-title">${state.mode==='c'?'工作区':'远程连接'}</span><span class="spacer"></span><button class="quick-search" data-action="switcher" aria-label="搜索并切换打开的会话">${icon('search')}<span>查找会话或主机</span><kbd>Ctrl K</kbd></button>${appButton('plus','新建连接','new')}${appButton('collapse',state.sidebar?'隐藏侧栏':'显示侧栏','sidebar')}<span class="window-chrome" aria-hidden="true"><span>−</span><span>□</span><span>×</span></span></div>`}
function activity(){return `<nav class="activity" aria-label="工作区导航"><button data-action="workspace" title="打开的会话" aria-label="打开的会话" class="${state.location==='workspace'?'active':''}">${icon('terminal')}<span class="tiny-count">${state.open.length}</span></button><button data-action="catalog" title="主机资源库" aria-label="主机资源库" class="${state.location==='catalog'?'active':''}">${icon('library')}</button><span class="spacer"></span><button data-action="preferences" title="原型显示偏好" aria-label="原型显示偏好">${icon('settings')}</button></nav>`}
function sessionRow(h,tree=false){return `<button class="session-row ${state.active===h.id&&state.location==='workspace'?'active':''}" data-open="${h.id}" aria-current="${state.active===h.id?'true':'false'}" title="${esc(h.name)} · ${h.protocol} · ${esc(h.host)}">${proto(h)}<span class="session-copy truncate"><span class="session-title truncate">${esc(h.name)}</span><span class="session-meta mono">${h.protocol} · ${esc(h.host)}</span></span>${state.open.includes(h.id)?connectionDot(h):''}</button>`}
function sideSearch(){return `<label class="side-search">${icon('search')}<span class="sr">筛选侧栏</span><input id="side-filter" placeholder="${state.mode==='b'?'筛选主机':'筛选打开的会话'}" value="${esc(state.sideQuery)}"></label>`}
function renderSidebar(){
 if(state.location==='catalog')return `<aside class="sidebar" aria-label="主机分组"><div class="side-head"><h3>资源库</h3><span class="count">${hosts.length}</span><span class="spacer"></span>${appButton('plus','新建连接','new')}</div><div class="side-scroll"><div class="section-label">主机分组</div>${[-1,0,1,2].map(g=>`<button class="group-row ${state.group===g?'active':''}" data-group="${g}">${icon(g===-1?'grid':'folder')}<span>${g===-1?'全部主机':groupNames[g]}</span><span class="count">${g===-1?hosts.length:hosts.filter(h=>h.group===g).length}</span></button>`).join('')}</div><div class="folder-hero"><b>我的资源库</b><br>SSH、RDP 与 VNC 连接配置<br>在列表中选择主机并连接</div><div class="side-foot">${icon('lock')}本地凭据已保护</div></aside>`;
 if(state.mode==='c')return `<aside class="sidebar task-sidebar" aria-label="任务工作区"><div class="side-head"><h3>工作区</h3><span class="count">3</span><span class="spacer"></span>${appButton('library','打开主机资源库','catalog')}</div><div class="side-scroll"><div class="section-label">当前任务</div>${tasks.map(t=>`<button class="task-row ${state.task===t.id?'active':''}" data-task="${t.id}" aria-current="${state.task===t.id}"><span class="task-mark">${t.mark}</span><span class="session-copy"><b>${t.name}</b><small>${t.note.split(' · ')[0]} · ${t.ids.filter(id=>state.open.includes(id)).length} 个会话</small></span></button>`).join('')}<div class="task-blurb"><h4>工作区说明</h4><p>${currentTask().description}</p></div></div><div class="side-foot"><span class="dot"></span>${state.open.length} 个连接保持打开</div></aside>`;
 let source=state.mode==='b'?hosts:opened();
 source=source.filter(h=>(h.name+' '+h.host).toLowerCase().includes(state.sideQuery.toLowerCase()));
 return `<aside class="sidebar" aria-label="${state.mode==='b'?'保存的主机':'打开的会话'}"><div class="side-head"><h3>${state.mode==='b'?'会话管理器':'打开的会话'}</h3><span class="count">${state.mode==='b'?hosts.length:state.open.length}</span><span class="spacer"></span>${appButton('plus','新建连接','new')}</div>${sideSearch()}<div class="side-scroll ${state.mode==='b'?'tree':''}" id="side-list">${groupNames.map((g,i)=>{const rows=source.filter(h=>h.group===i);return rows.length?`<div class="section-label ${i===1?'test':''}">${g}<span class="spacer"></span><span class="count">${rows.length}</span></div>${rows.map(h=>sessionRow(h,state.mode==='b')).join('')}`:''}).join('')||'<div class="no-results">没有匹配会话</div>'}</div><div class="side-foot"><span class="dot"></span>${state.open.length} 个连接<span class="spacer"></span><span>${state.mode==='b'?'主机目录':'仅显示已打开'}</span></div></aside>`;
}
function tabStrip(){
 const visible=[...new Set([...state.pinned.filter(id=>state.open.includes(id)),state.active,...state.open])].slice(0,3);
 return `<div class="tabstrip" role="tablist" aria-label="常用与当前会话">${visible.filter(id=>state.open.includes(id)).map(id=>`<button role="tab" aria-selected="${state.active===id}" class="tab ${state.active===id?'active':''}" data-open="${id}">${connectionDot(byId(id))}<span class="truncate">${esc(byId(id).name)}</span><span class="pin">${state.pinned.includes(id)?'固定':''}</span></button>`).join('')}<button class="overflow-btn" data-action="switcher" aria-label="查看全部打开会话">${icon('down')}<span>全部 ${state.open.length}</span></button></div>`;
}
function contentHead(h){return `<div class="content-head"><div class="truncate"><div class="content-title truncate">${esc(h.name)}</div><div class="content-sub mono">${esc(h.user)}@${esc(h.host)} · ${h.protocol==='SSH'?22:h.protocol==='VNC'?5901:3389}</div></div><span class="env">${groupNames[h.group].replace('环境','')}</span><div class="head-actions"><span class="pill optional">${h.protocol}</span>${appButton('library','选择另一台主机','catalog')}${state.mode==='b'?appButton('pin',state.pinned.includes(h.id)?'取消固定当前标签':'固定当前标签','pin'):''}${appButton('close','关闭当前会话','close-session')}</div></div>`}

function terminal(h,small=false){
 const main=h.id===1||h.id===2;
 const lines=main?[
  `<span class="dim">Last login: Mon Oct 26 09:14:06 2026 from 10.20.0.1</span>`,
  `<span class="green">ops@${esc(h.name)}</span>:<span class="blue">~</span>$ kubectl get pods -n production`,
  '',`<span class="dim">NAME                              READY   STATUS    RESTARTS</span>`,
  `api-server-7c89d4b6f5-2m8kq        <span class="green">1/1     Running</span>   0`,
  `api-server-7c89d4b6f5-9x6hp        <span class="green">1/1     Running</span>   0`,
  `api-worker-84fc9f76b-4q7wn         <span class="green">1/1     Running</span>   0`,
  '',`<span class="green">ops@${esc(h.name)}</span>:<span class="blue">~</span>$ systemctl status api-gateway`,
  `<span class="green">●</span> api-gateway.service - API Gateway`,
  `     Loaded: loaded (/etc/systemd/system/api-gateway.service; enabled)`,
  `     Active: <span class="green">active (running)</span> since Mon 2026-10-26 08:00:00 CST`,
  `   Main PID: 1462 (api-gateway)`,
  '',`<span class="dim">09:14:09</span> <span class="green">INFO</span>  upstream pool ready        <span class="dim">healthy=8/8</span>`,
  `<span class="dim">09:14:12</span> <span class="green">INFO</span>  request completed          <span class="dim">status=200  24ms</span>`
 ]:h.id===3||h.id===4?[
  `<span class="green">ops@${esc(h.name)}</span>:<span class="blue">~</span>$ pg_isready`,
  `/var/run/postgresql:5432 - <span class="green">accepting connections</span>`,
  '',`<span class="green">ops@${esc(h.name)}</span>:<span class="blue">~</span>$ psql -c "select state, count(*)"`,
  `<span class="dim"> state              | count</span>`,
  `--------------------+-------`,
  ` active             |    12`,
  ` idle               |    48`,
  '',`<span class="dim">Replication lag: </span><span class="green">0.02s</span>`,
  `<span class="dim">Connections:     </span>60 / 200`,
  `<span class="dim">Cache hit ratio: </span><span class="green">99.8%</span>`
 ]:[
  `<span class="green">ops@${esc(h.name)}</span>:<span class="blue">~</span>$ uptime`,
  ` 09:16:42 up 32 days,  load average: <span class="green">0.18, 0.24, 0.21</span>`,
  '',`<span class="green">ops@${esc(h.name)}</span>:<span class="blue">~</span>$ journalctl -n 6 --no-pager`,
  `<span class="dim">09:14:10</span> service health check <span class="green">passed</span>`,
  `<span class="dim">09:14:12</span> worker pool initialized`,
  `<span class="dim">09:14:15</span> configuration loaded`,
  `<span class="dim">09:14:18</span> upstream connection established`,
  `<span class="dim">09:14:20</span> <span class="green">ready to accept requests</span>`
 ];
 const shown=small?lines.slice(0,10):lines;
 return `<div class="terminal">${shown.map(line=>`<div class="line">${line||' '}</div>`).join('')}<div class="command"><span><span class="green">ops@${esc(h.name)}</span>:<span class="blue">~</span>$</span><input class="terminal-input" data-terminal="${h.id}" aria-label="${esc(h.name)} 命令输入（原型）" placeholder="${state.demo==='readonly'?'只读模式':''}" ${state.demo==='readonly'?'disabled':''} autocomplete="off" spellcheck="false"></div><div class="terminal-output" data-output="${h.id}">${esc(state.outputs[h.id]||'')}</div></div>`;
}
function desktop(){return `<div class="remote-desktop"><div class="desktop-window"><header>${icon('folder')}此电脑<span class="spacer"></span><span>−　□　×</span></header><div class="desktop-content"><h3>构建与发布</h3><p>Windows build workstation</p><div class="desktop-stat"><div>CPU　12%</div><div>RAM　6.4 GB</div></div><div class="desktop-file">${icon('folder')}build-output<span>文件夹</span></div><div class="desktop-file">${icon('file')}release-notes.txt<span>4 KB</span></div></div></div><div class="desktop-taskbar"><span></span><span></span><span></span></div></div>`}
function readOnly(){return state.demo==='readonly'?`<div class="read-only">${icon('lock')}此会话处于只读模式，键盘与鼠标输入已关闭<button data-action="request-control">启用控制</button></div>`:''}
function partial(){return state.demo==='partial'?`<div class="partial-note">${icon('alert')}prod-db-primary 连接失败，其他会话保持连接<button data-action="retry">重试</button></div>`:''}
function statePanel(kind){
 const info=kind==='loading'?{title:'正在建立连接',desc:`${active().name} · 正在等待远端应答`,icon:'clock',button:'取消连接',action:'cancel-connect'}:kind==='error'?{title:'连接未能建立',desc:`${active().host}:22 响应超时。检查网络后可在此会话中重试。`,icon:'alert',button:'重新连接',action:'retry'}:{title:'开始一个连接',desc:'从主机资源库选择目标，已保存的连接信息会自动填入。',icon:'terminal',button:'选择主机',action:'catalog'};
 return `<div class="state-panel">${kind==='loading'?'<span class="spinner" role="status" aria-label="正在连接"></span>':icon(info.icon)}<h3>${info.title}</h3><p>${info.desc}</p><div class="state-actions"><button class="primary" data-action="${info.action}">${info.button}</button>${kind==='error'?'<button class="secondary" data-action="catalog">返回资源库</button>':''}</div></div>`;
}
function sessionStage(){
 if(!state.open.length)return `<section class="stage" aria-label="会话内容">${statePanel('empty')}</section>`;
 const h=active();
 return `<section class="stage" aria-label="会话内容">${state.mode==='b'?tabStrip():''}${contentHead(h)}${tools(h)}${readOnly()}${partial()}${['loading','error'].includes(state.demo)?statePanel(state.demo):`<div class="workarea">${h.protocol==='SSH'?terminal(h):desktop()}<span class="terminal-hint">${h.protocol==='SSH'?'SSH / '+h.name:'远程桌面 / '+h.name}</span></div>`}</section>`;
}
function taskStage(){
 if(!state.open.length)return `<section class="stage">${statePanel('empty')}</section>`;
 const t=currentTask(),list=t.ids.map(byId).filter(h=>state.open.includes(h.id));
 const visible=state.singlePane?list.filter(h=>h.id===state.focusPane):list;
 return `<section class="stage" aria-label="任务工作区内容"><div class="content-head"><div class="truncate"><div class="content-title">${t.name}</div><div class="content-sub">${t.note.split(' · ')[0]} · ${list.length} 个会话保持连接</div></div><div class="head-actions"><button class="secondary split-label" data-action="single">${icon(state.singlePane?'grid':'expand')}<span>${state.singlePane?'返回分屏':'聚焦当前'}</span></button><button class="primary" data-action="switcher">切换会话</button></div></div>${readOnly()}${partial()}${['loading','error'].includes(state.demo)?statePanel(state.demo):!visible.length?statePanel('empty'):`<div class="pane-grid ${state.singlePane?'one':visible.length===3?'three':''}">${visible.map(h=>`<section class="pane ${state.focusPane===h.id?'focused':''}" data-pane="${h.id}" aria-label="${esc(h.name)} 分屏"><header class="pane-head">${connectionDot(h)}<span class="truncate">${h.protocol} · ${esc(h.name)}</span><button data-focus="${h.id}" aria-label="聚焦 ${esc(h.name)}">${icon('expand')}<span>聚焦</span></button></header>${state.demo==='partial'&&h.id===3?`<div class="state-panel"><h3>连接超时</h3><p>其他会话正常运行</p><button class="secondary" data-action="retry">重试连接</button></div>`:h.protocol==='SSH'?terminal(h,true):desktop()}</section>`).join('')}</div>`}</section>`;
}
function catalogStage(){
 let list=hosts.filter(h=>(state.group<0||h.group===state.group)&&(h.name+' '+h.host+' '+h.user).toLowerCase().includes(state.catalogQuery.toLowerCase()));
 return `<section class="stage" aria-label="主机资源列表"><div class="content-head"><div><div class="content-title">${state.group<0?'全部主机':groupNames[state.group]}</div><div class="content-sub">连接配置与分组</div></div><div class="head-actions"><button class="secondary" data-action="workspace">返回工作区</button><button class="primary" data-action="new">新建连接</button></div></div><div class="catalog"><div class="catalog-toolbar"><label class="side-search">${icon('search')}<span class="sr">搜索主机资源</span><input id="catalog-search" placeholder="搜索名称、地址或用户名" value="${esc(state.catalogQuery)}"></label><span class="pill">${list.length} 台主机</span></div><div class="table-wrap"><table class="host-table"><thead><tr><th>主机名称</th><th class="host-address">连接地址</th><th class="host-protocol">协议</th><th class="host-group">分组</th><th>操作</th></tr></thead><tbody>${list.map(h=>`<tr><td><span class="host-cell">${proto(h)}<span class="truncate">${esc(h.name)}<small>${esc(h.user)}</small></span></span></td><td class="mono host-address">${esc(h.host)}</td><td class="host-protocol"><span class="pill">${h.protocol}</span></td><td class="host-group">${groupNames[h.group]}</td><td><button class="${state.open.includes(h.id)?'secondary':'primary'}" data-open="${h.id}">${state.open.includes(h.id)?'切换':'连接'}</button></td></tr>`).join('')}</tbody></table>${!list.length?'<div class="no-results">没有匹配的主机，试试其他名称或地址</div>':''}</div></div></section>`;
}
function footer(){return `<div class="statusbar"><span><span class="dot"></span>${state.open.length} 个打开会话</span><span class="optional">${state.mode==='a'?'资源与工作分离':state.mode==='b'?'最多 3 个可见标签':'按任务组织'}</span><span class="spacer"></span><span class="bottom-badge">${state.demo==='readonly'?'只读模式':'凭据已保护'}</span><span class="optional mono">UTF-8</span><span class="mono">v0.1.76</span></div>`}
function render(){
 const m=modes[state.mode];
 document.querySelector('#variant-title').innerHTML=`${state.mode.toUpperCase()} / ${m.title}${m.recommend?'<span class="recommend">优先推荐</span>':''}`;
 document.querySelector('#variant-description').textContent=m.desc;
 document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===state.mode)));
 document.querySelector('#theme-toggle').textContent=state.theme==='light'?'深色':'浅色';
 document.querySelector('#density-toggle').setAttribute('aria-pressed',String(state.compact));
 document.querySelector('#demo-state').value=state.demo;
 app.dataset.theme=state.theme;
 app.className=`app ${state.compact?'compact':''} ${state.mode==='b'?'classic':''} ${!state.sidebar?'sidebar-hidden':''}`;
 const stage=state.location==='catalog'?catalogStage():state.mode==='c'?taskStage():sessionStage();
 app.innerHTML=titleBar()+(state.mode==='b'?'<div class="classic-menu"><span>文件</span><span>会话</span><span>编辑</span><span>查看</span><span>工具</span><span>帮助</span></div>':'')+`<div class="app-body">${activity()}${renderSidebar()}${stage}</div>`+footer();
 if(state.modal)renderModal();
 if(state.toast)renderToast();
}
function showToast(message){state.toast=message;renderToast();clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>{state.toast=null;document.querySelector('.toast')?.remove()},2400)}
function renderToast(){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=state.toast;app.append(el)}
function paletteResults(){return opened().filter(h=>(h.name+' '+h.host+' '+h.protocol).toLowerCase().includes(state.paletteQuery.toLowerCase()))}
function paletteRows(){const rows=paletteResults();state.paletteIndex=Math.min(state.paletteIndex,Math.max(0,rows.length-1));return rows.map((h,i)=>`<button class="switch-row ${state.paletteIndex===i?'selected':''}" data-switch="${h.id}" aria-label="切换到 ${esc(h.name)}">${proto(h)}<span class="session-copy truncate"><span class="session-title">${esc(h.name)}</span><span class="session-meta mono">${h.protocol} · ${esc(h.host)}</span></span>${connectionDot(h)}${state.active===h.id?'<span class="pill">当前</span>':''}</button>`).join('')||'<div class="no-results">没有匹配的打开会话</div>'}
function openModal(type){state.returnFocus=document.activeElement;state.modal=type;state.paletteQuery='';state.paletteIndex=0;renderModal();requestAnimationFrame(()=>(document.querySelector('#palette-search,#new-name')||document.querySelector('.dialog button'))?.focus())}
function closeModal(){state.modal=null;document.querySelector('.modal-scrim')?.remove();if(state.returnFocus?.isConnected)state.returnFocus.focus();else document.querySelector('[data-action="switcher"]')?.focus()}
function renderModal(){
 document.querySelector('.modal-scrim')?.remove();
 const holder=document.createElement('div');holder.className='modal-scrim';
 let content='';
 if(state.modal==='switcher')content=`<div class="dialog-head"><h3>打开的会话</h3><span class="count">${state.open.length}</span>${appButton('close','关闭会话切换器','modal-close')}</div><div class="dialog-search">${icon('search')}<input id="palette-search" aria-label="搜索打开会话" placeholder="输入名称、地址或协议…" value="${esc(state.paletteQuery)}"></div><div class="dialog-list" id="palette-results">${paletteRows()}</div><div class="dialog-footer"><span>↑ ↓ 选择</span><span>Enter 切换</span><span>Esc 返回</span><span class="spacer"></span><span>连接保持打开</span></div>`;
 if(state.modal==='new')content=`<div class="dialog-head"><h3>新建连接</h3>${appButton('close','关闭新建连接','modal-close')}</div><form id="connection-form"><div class="form-body"><label>协议<select id="new-protocol" name="protocol"><option>SSH</option><option>VNC</option><option>RDP</option></select></label><label>名称<input id="new-name" name="name" placeholder="例如：prod-api-03" required maxlength="80"></label><div class="form-grid"><label>连接地址<input id="new-host" name="host" placeholder="10.20.0.25" required maxlength="120"></label><label>端口<input id="new-port" name="port" value="22" type="number" min="1" max="65535" required></label></div><label>用户名<input name="user" value="ops" maxlength="80"></label><div class="validation" id="form-error" role="alert"></div></div><div class="form-actions"><button type="button" class="secondary" data-action="modal-close">取消</button><button type="submit" class="primary">保存并打开</button></div></form>`;
 if(state.modal==='control')content=`<div class="dialog-head"><h3>切换为可控模式</h3>${appButton('close','关闭控制确认','modal-close')}</div><div class="form-body"><p>启用后，键盘和鼠标操作将发送到当前远程会话。</p><p class="muted">请确认当前输入目标：${esc(active().name)}</p></div><div class="form-actions"><button class="secondary" data-action="modal-close">保持只读</button><button class="primary" data-action="allow-control">启用控制</button></div>`;
 holder.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-label="${state.modal==='switcher'?'切换打开会话':state.modal==='new'?'新建连接':'启用控制'}">${content}</section>`;
 holder.addEventListener('click',e=>{if(e.target===holder)closeModal()});app.append(holder);
}
function openHost(id){
 const h=byId(id);if(!state.open.includes(h.id))state.open.push(h.id);
 state.active=h.id;state.focusPane=h.id;state.location='workspace';state.demo=state.demo==='empty'?'normal':state.demo;
 if(state.mode==='c'&&!currentTask().ids.includes(h.id)){let task=tasks.find(t=>t.ids.includes(h.id));if(!task){task=tasks[2];task.ids.push(h.id);task.note=`测试与基础设施 · ${task.ids.length} 个会话`}state.task=task.id}
 state.modal=null;if(narrowQuery.matches)state.sidebar=false;render();requestAnimationFrame(()=>document.querySelector('.terminal-input:not([disabled]),[data-action="switcher"]')?.focus());
}
function setDemo(value){state.demo=value;if(value==='empty')state.open=[];else if(!state.open.length){state.open=hosts.slice(0,12).map(h=>h.id);state.active=1;state.focusPane=1}state.location='workspace';render()}
function retry(){state.demo='loading';render();setTimeout(()=>{state.demo='normal';render();showToast('连接已恢复，其他会话保持打开')},650)}
const actions={
 workspace:()=>{state.location='workspace';render()},
 catalog:()=>{state.location='catalog';state.catalogQuery='';render()},
 sidebar:()=>{state.sidebar=!state.sidebar;render()},
 switcher:()=>openModal('switcher'),
 new:()=>openModal('new'),
 'modal-close':closeModal,
 readonly:()=>{if(state.demo==='readonly')openModal('control');else setDemo('readonly')},
 'request-control':()=>openModal('control'),
 'allow-control':()=>{state.demo='normal';state.modal=null;render();showToast('当前会话已切换为可控模式')},
 'close-session':()=>{state.open=state.open.filter(id=>id!==state.active);state.pinned=state.pinned.filter(id=>id!==state.active);state.active=state.open[0]||1;state.focusPane=state.active;render();showToast('当前会话已关闭')},
 pin:()=>{const id=state.active;if(state.pinned.includes(id))state.pinned=state.pinned.filter(x=>x!==id);else state.pinned=[...state.pinned.slice(-1),id];render()},
 single:()=>{state.singlePane=!state.singlePane;render()},
 retry,
 'cancel-connect':()=>{state.demo='normal';render();showToast('已取消本次连接尝试')},
 files:()=>showToast('本组原型聚焦会话组织，文件面板待后续设计'),
 fit:()=>showToast('画面已适应当前窗口'),
 preferences:()=>{state.compact=!state.compact;render();showToast(state.compact?'已切换为紧凑密度':'已切换为舒适密度')}
};
document.addEventListener('click',e=>{
 const variant=e.target.closest('[data-variant]');if(variant){state.mode=variant.dataset.variant;state.theme=state.mode==='c'?'dark':'light';state.location='workspace';state.modal=null;state.singlePane=false;state.sidebar=!narrowQuery.matches;if(state.mode==='c'){state.task=(tasks.find(t=>t.ids.includes(state.active))||tasks[0]).id;state.focusPane=currentTask().ids.includes(state.active)?state.active:currentTask().ids[0]}render();return}
 if(e.target.closest('#theme-toggle')){state.theme=state.theme==='light'?'dark':'light';render();return}
 if(e.target.closest('#density-toggle')){state.compact=!state.compact;render();return}
 const action=e.target.closest('[data-action]');if(action){actions[action.dataset.action]?.();return}
 const open=e.target.closest('[data-open]');if(open){openHost(Number(open.dataset.open));return}
 const choose=e.target.closest('[data-switch]');if(choose){openHost(Number(choose.dataset.switch));return}
 const group=e.target.closest('[data-group]');if(group){state.group=Number(group.dataset.group);if(narrowQuery.matches)state.sidebar=false;render();return}
 const task=e.target.closest('[data-task]');if(task){state.task=task.dataset.task;state.focusPane=currentTask().ids.find(id=>state.open.includes(id))||currentTask().ids[0];state.active=state.focusPane;state.singlePane=false;if(narrowQuery.matches)state.sidebar=false;render();return}
 const focus=e.target.closest('[data-focus]');if(focus){state.focusPane=Number(focus.dataset.focus);state.active=state.focusPane;state.singlePane=true;render();return}
 const pane=e.target.closest('[data-pane]');if(pane){state.focusPane=Number(pane.dataset.pane);state.active=state.focusPane;document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('focused',Number(p.dataset.pane)===state.focusPane))}
});
document.addEventListener('input',e=>{
 if(e.target.id==='palette-search'){state.paletteQuery=e.target.value;state.paletteIndex=0;document.querySelector('#palette-results').innerHTML=paletteRows()}
 if(e.target.id==='side-filter'){state.sideQuery=e.target.value;const start=e.target.selectionStart;render();const input=document.querySelector('#side-filter');input?.focus();input?.setSelectionRange(start,start)}
 if(e.target.id==='catalog-search'){state.catalogQuery=e.target.value;const start=e.target.selectionStart;render();const input=document.querySelector('#catalog-search');input?.focus();input?.setSelectionRange(start,start)}
});
document.addEventListener('change',e=>{
 if(e.target.id==='demo-state')setDemo(e.target.value);
 if(e.target.id==='new-protocol')document.querySelector('#new-port').value=e.target.value==='SSH'?22:e.target.value==='VNC'?5900:3389;
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='connection-form')return;e.preventDefault();const data=new FormData(e.target);
 const name=String(data.get('name')).trim(),host=String(data.get('host')).trim();
 if(!name||!host){document.querySelector('#form-error').textContent='请填写名称和连接地址';return}
 const id=hosts.reduce((n,h)=>Math.max(n,h.id),0)+1;hosts.push({id,name,host,user:String(data.get('user')).trim()||'ops',protocol:String(data.get('protocol')),group:1});state.demo='normal';openHost(id);showToast('连接已保存并打开（交互演示）');
});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.modal?closeModal():openModal('switcher');return}
 if(state.modal&&e.key==='Escape'){e.preventDefault();closeModal();return}
 if(state.modal&&e.key==='Tab'){
  const nodes=[...document.querySelectorAll('.dialog button:not([disabled]),.dialog input:not([disabled]),.dialog select')].filter(el=>el.getClientRects().length);
  if(nodes.length){const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&(document.activeElement===first||!document.activeElement.closest('.dialog'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||!document.activeElement.closest('.dialog'))){e.preventDefault();first.focus()}}
 }
 if(state.modal==='switcher'&&['ArrowDown','ArrowUp','Enter'].includes(e.key)){e.preventDefault();const list=paletteResults();if(!list.length)return;if(e.key==='Enter'){openHost(list[state.paletteIndex].id);return}state.paletteIndex=(state.paletteIndex+(e.key==='ArrowDown'?1:list.length-1))%list.length;document.querySelector('#palette-results').innerHTML=paletteRows();document.querySelector('.switch-row.selected')?.scrollIntoView({block:'nearest'});return}
 if(e.target.matches('.tab')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...document.querySelectorAll('.tab')],at=tabs.indexOf(e.target),next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(at+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;const id=Number(tabs[next].dataset.open);openHost(id);requestAnimationFrame(()=>document.querySelector('.tab.active')?.focus());return}
 if(e.target.matches('.terminal-input')&&e.key==='Enter'){
  e.preventDefault();const command=e.target.value.trim(),id=Number(e.target.dataset.terminal);if(!command)return;
  const h=byId(id);let result=command==='hostname'?h.name:command==='whoami'?h.user:command==='pwd'?'/home/'+h.user:command==='date'?'Mon Oct 26 09:18:00 CST 2026':command==='clear'?'':'原型演示：命令未发送到真实主机。可试 hostname / whoami / pwd';
  state.outputs[id]=command==='clear'?'':`$ ${command}\n${result}`;const output=document.querySelector(`[data-output="${id}"]`);if(output)output.textContent=state.outputs[id];e.target.value='';
 }
});
render();
</script>
</body>
</html>
