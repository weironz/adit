name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Fixed X displays and fixture names must never overlap across workflow runs.
concurrency:
  group: adit-self-hosted-ci
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  build:
    name: build · clippy · test · integration (${{ matrix.platform }})
    # Persistent runners execute trusted repository branches only, never fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: [self-hosted, Windows, X64, home-workstation, repo-adit]
            shell: pwsh
          - platform: linux-x64
            runner: [self-hosted, Linux, X64, home-workstation, repo-adit]
            shell: bash
    # ARM64 and macOS are intentionally paused. No hosted fallback is configured.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # These dedicated runners keep Cargo outputs; clean everything else below.
          clean: false
      - name: Clean checkout while retaining compiler outputs
        run: git clean -ffdx -e /target/ -e /crates/adit-rdp/target/
      - name: Complete Windows build dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: .github/scripts/setup-windows-runner.ps1
      - name: Complete Linux build dependencies
        if: runner.os == 'Linux'
        run: bash .github/scripts/setup-linux-runner.sh
      - name: Install stable Rust and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Record toolchain
        run: |
          rustc --version
          cargo --version
      - name: Check isolated Linux fixture resources
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import pathlib, socket
          for display in (99, 104, 109, 114):
              assert not pathlib.Path(f'/tmp/.X{display}-lock').exists(), f'X display {display} already in use'
          for port in (12222, 15900, 15901, 15903, 15908, 15909, 15912, 15914):
              with socket.socket() as s:
                  s.bind(('127.0.0.1', port))
          PY
          for name in adit-vnc-integration adit-vnc-cursor; do
            if docker container inspect "$name" >/dev/null 2>&1; then
              echo "::error::fixture container $name already exists; refusing to replace it"
              exit 1
            fi
          done
      - name: Every tracked file must match .gitattributes
        if: runner.os == 'Linux'
        run: |
          # A stored CRLF workflow once dirtied a release checkout and broke its push.
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo '::error::these files are stored with line endings that contradict .gitattributes — re-save them as LF and commit'
            git diff --cached --name-only
            exit 1
          fi
          echo 'every tracked file is stored as .gitattributes declares'
      - name: Verify captured Windows evidence
        if: runner.os == 'Linux'
        run: python3 tests/vnc/analyze_windows_layout.py tests/vnc/results/2026-10-19-windows-layout
      - name: Build
        run: cargo build --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy the opt-in native VNC acceptance harness
        run: cargo clippy -p adit-ui --example vnc_native_acceptance --features native-vnc-acceptance --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: VNC integration against x11vnc and TigerVNC
        if: runner.os == 'Linux'
        shell: bash
        env:
          ADIT_VNC_TRACE_FLOW: '1'
        run: |
          export DISPLAY=:99
          Xvfb "$DISPLAY" -noreset -screen 0 800x600x24 > /tmp/adit-xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill ${server_pid:-} ${xvfb_pid:-} ${xev_pid:-} 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if xsetroot -solid red 2>/dev/null; then break; fi
            sleep 0.1
          done
          # Disposable CI-only credentials; no production host is involved.
          export ADIT_VNC_TEST_PASSWORD=adit-ci
          export ADIT_VNC_TEST_PORT=15900
          export ADIT_VNC_TEST_EVENTS=/tmp/adit-vnc-events.log
          start_input_target() {
            xev -name AditVncTest -geometry 120x100+0+0 -event keyboard -event mouse \
              > "$ADIT_VNC_TEST_EVENTS" 2>&1 &
            xev_pid=$!
            for attempt in {1..50}; do
              if xdotool search --name AditVncTest windowfocus 2>/dev/null; then return; fi
              sleep 0.1
            done
            return 1
          }
          start_input_target
          x11vnc -storepasswd "$ADIT_VNC_TEST_PASSWORD" /tmp/adit-vnc-passwd
          x11vnc -display "$DISPLAY" -rfbport "$ADIT_VNC_TEST_PORT" \
            -rfbauth /tmp/adit-vnc-passwd -localhost -forever -shared \
            > /tmp/adit-x11vnc.log 2>&1 &
          server_pid=$!
          for attempt in {1..50}; do
            if (echo > /dev/tcp/127.0.0.1/15900) 2>/dev/null; then break; fi
            sleep 0.1
          done
          cargo test -p adit-session --test vnc real_vnc_server_authenticates_and_paints -- --ignored
          kill "$server_pid" "$xvfb_pid" "$xev_pid"
          wait "$server_pid" 2>/dev/null || true
          wait "$xvfb_pid" 2>/dev/null || true
          Xtigervnc "$DISPLAY" -noreset -geometry 800x600 -depth 24 -rfbport "$ADIT_VNC_TEST_PORT" \
            -PasswordFile /tmp/adit-vnc-passwd -SecurityTypes VncAuth -localhost \
            > /tmp/adit-tigervnc.log 2>&1 &
          server_pid=$!
          for attempt in {1..50}; do
            if xsetroot -solid red 2>/dev/null; then break; fi
            sleep 0.1
          done
          start_input_target
          cargo test -p adit-session --test vnc real_vnc_server_authenticates_and_paints -- --ignored
          ADIT_VNC_CLIP_LOCAL=1 ADIT_VNC_CLIP_PORT=15900 ADIT_VNC_CLIP_DISPLAY=99 \
            cargo test -p adit-session --test vnc_clipboard -- --ignored

      - name: VNC shared clients follow real desktop resize
        if: runner.os == 'Linux'
        timeout-minutes: 2
        shell: bash
        env:
          ADIT_VNC_TRACE_FLOW: '1'
        run: |
          Xtigervnc :104 -noreset -geometry 800x600 -depth 24 -rfbport 15908 \
            -PasswordFile /tmp/adit-vnc-passwd -SecurityTypes VncAuth -localhost \
            > /tmp/adit-vnc-resize.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..50}; do
            if DISPLAY=:104 xsetroot -solid red 2>/dev/null; then ready=true; break; fi
            sleep 0.1
          done
          "$ready"
          cargo test -p adit-session --test vnc_resize -- --ignored --test-threads=1

      - name: Preserve real VNC server and input diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vnc-linux-server-diagnostics
          path: |
            /tmp/adit-xvfb.log
            /tmp/adit-x11vnc.log
            /tmp/adit-tigervnc.log
            /tmp/adit-vnc-events.log
            /tmp/adit-vnc-resize.log
          if-no-files-found: warn

      - name: Build the VNC recovery probe
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          cargo build -p adit-session --example vnc_recovery_probe --locked

      - name: VNC recovery across real isolated client interfaces
        if: runner.os == 'Linux'
        timeout-minutes: 4
        shell: bash
        run: timeout --signal=TERM --kill-after=10s 180s bash tests/vnc/network-recovery.sh target/debug/examples/vnc_recovery_probe "$RUNNER_TEMP/adit-vnc-network-result"

      - name: Preserve VNC network recovery evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vnc-network-recovery
          path: ${{ runner.temp }}/adit-vnc-network-result
          if-no-files-found: warn

      - name: VNC SSH gateway and protected credential connections
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker build -t adit-vnc-integration:local tests/vnc
          cleanup() {
            for name in adit-vnc-integration adit-vnc-cursor; do
              owner=$(docker inspect -f '{{index .Config.Labels "adit.ci.run"}}' "$name" 2>/dev/null || true)
              if [[ "$owner" == "$GITHUB_RUN_ID" ]]; then docker rm -f "$name"; fi
            done
          }
          trap cleanup EXIT
          docker run -d --name adit-vnc-integration --label "adit.ci.run=$GITHUB_RUN_ID" --memory 1g \
            -p 127.0.0.1:15901:15901 -p 127.0.0.1:12222:22 \
            -p 127.0.0.1:15903:15903 adit-vnc-integration:local
          for attempt in {1..100}; do
            if docker exec adit-vnc-integration test -f /tmp/vnc-passwd \
              && (echo > /dev/tcp/127.0.0.1/12222) 2>/dev/null; then break; fi
            sleep 0.1
          done
          # A separate display supplies the vault's ordinary direct VNC path.
          docker exec -d adit-vnc-integration Xtigervnc :108 -noreset \
            -geometry 800x600 -depth 24 -rfbport 15903 \
            -PasswordFile /tmp/vnc-passwd -SecurityTypes VncAuth -localhost=0
          for attempt in {1..100}; do
            if (echo > /dev/tcp/127.0.0.1/15903) 2>/dev/null; then break; fi
            sleep 0.1
          done
          cargo test -p adit-session --test vnc_gateway -- --ignored --test-threads=1
          cargo test -p adit-ui --test vault_connections -- --ignored --test-threads=1
          docker create --name adit-vnc-cursor --label "adit.ci.run=$GITHUB_RUN_ID" --memory 512m \
            -p 127.0.0.1:15912:15912 --entrypoint /bin/sh \
            adit-vnc-integration:local -c 'sleep 3600'
          docker cp tests/vnc/cursor_target.py adit-vnc-cursor:/cursor_target.py
          docker cp tests/vnc/start-cursor.sh adit-vnc-cursor:/start-cursor.sh
          docker start adit-vnc-cursor
          docker exec -d adit-vnc-cursor /bin/sh /start-cursor.sh
          for attempt in {1..100}; do
            if docker exec adit-vnc-cursor test -S /tmp/adit-vnc-cursor.sock; then break; fi
            sleep 0.1
          done
          cargo test -p adit-session --test vnc_cursor_real -- --ignored

      # The RDP helper is excluded from the workspace (IronRDP's dependency pins
      # cannot coexist with russh's), so nothing above touches it — until now it
      # was built only at release time, where a break lands too late to be cheap.
      # Windows only: it ships as adit-rdp-host.exe. ARM64 is paused together
      # with the other non-x64 targets; the independent helper stays covered.
      - name: Build the RDP helper
        if: runner.os == 'Windows'
        run: cargo build --manifest-path crates/adit-rdp/Cargo.toml --locked

      # And lint it, for the same reason: `cargo clippy --workspace` above sees
      # only the root workspace, so for as long as the helper was merely built
      # here its lints went unread. They rotted exactly as you would expect —
      # 1.98's `chunks_exact_to_as_chunks` sat red in egfx.rs and redirect.rs
      # while every CI run was green. Building is not linting.
      - name: Clippy the RDP helper
        if: runner.os == 'Windows'
        run: cargo clippy --manifest-path crates/adit-rdp/Cargo.toml --all-targets --locked -- -D warnings
      - name: Launch headless
        if: runner.os == 'Linux'
        env:
          RUST_BACKTRACE: '1'
          ADIT_CONFIG_DIR: ${{ runner.temp }}/adit-smoke-config
        run: |
          launch() {
            local label="$1" log="$2"
            local status=0
            timeout --kill-after=5s 25s xvfb-run -a --server-args='-screen 0 1280x800x24' \
              target/debug/adit-app > "$log" 2>&1 || status=$?
            if [[ "$status" != 124 ]]; then
              echo "::error::$label: adit-app exited on its own during startup"
              return 1
            fi
            echo "$label: still up after 25s; process group stopped"
          }

          status=0
          launch 'default renderer' smoke-default.log || status=1
          WGPU_BACKEND=vulkan launch 'forced Vulkan' smoke-vulkan.log || status=1
          exit $status

      # Always shown, including on failure — the panic or adapter error lands
      # here, not in the step above.
      - name: Startup logs
        if: always() && runner.os == 'Linux'
        run: |
          for log in smoke-default.log smoke-vulkan.log; do
            echo "===== $log ====="
            cat "$log" 2>/dev/null || echo '(not produced)'
          done
      - name: Build the app
        if: runner.os == 'Linux'
        run: cargo build --release -p adit-app --locked

      # The same script release.yml runs — the dependency lists must not exist
      # twice.
      - name: Build the packages
        if: runner.os == 'Linux'
        run: |
          installer/build-linux-packages.sh

      # The real test. Installing into a bare ubuntu image means apt has to
      # satisfy Depends on its own, with none of the -dev packages the build
      # steps above left lying around — so a missing entry fails here instead of
      # on a user's machine.
      - name: Install and run it in a clean container
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -eu -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq ./adit_*.deb xvfb >/dev/null
            xvfb-run -a --server-args="-screen 0 1280x800x24" adit > /w/pkg-smoke.log 2>&1 &
            pid=$!
            sleep 25
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              echo "installed adit stayed up; the dependency list is complete"
            else
              echo "::error::the installed adit exited on its own — Depends is incomplete or wrong"
              exit 1
            fi
          '

      # Fedora rather than Ubuntu, so this also exercises whether a binary built
      # on the Ubuntu runner is usable elsewhere at all — it carries that image's
      # glibc floor, which is the thing most likely to bite on older RPM distros.
      - name: Install and run the rpm in a clean container
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/w" -w /w fedora:latest bash -eu -c '
            dnf -y -q install ./rpmbuild/RPMS/x86_64/adit-*.rpm xorg-x11-server-Xvfb >/dev/null
            xvfb-run -a --server-args="-screen 0 1280x800x24" adit > /w/rpm-smoke.log 2>&1 &
            pid=$!
            sleep 25
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              echo "installed adit stayed up on Fedora"
            else
              echo "::error::the installed adit exited on its own on Fedora"
              exit 1
            fi
          '

      - name: Package startup logs
        if: always() && runner.os == 'Linux'
        run: |
          for log in pkg-smoke.log rpm-smoke.log; do
            echo "===== $log ====="
            cat "$log" 2>/dev/null || echo '(not produced)'
          done

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: adit-linux-packages-x86_64
          path: |
            adit_*.deb
            rpmbuild/RPMS/*/adit-*.rpm
          if-no-files-found: warn

      - name: Real SSH integration
        if: runner.os == 'Linux'
        run: cargo test -p adit-ssh --features integration --locked -- --include-ignored --test-threads=4

