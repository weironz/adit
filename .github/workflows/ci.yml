name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows is the shipping target; macOS and Linux are here to keep the code
      # honest, since nothing else verifies that Adit even compiles there.
      # Independent reporting on purpose — while those two are being brought up, a
      # Linux failure must not hide a macOS one.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # iced pulls winit (X11/Wayland) and wgpu, rfd pulls GTK, keyring pulls
      # D-Bus. Windows and macOS need none of this.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgtk-3-dev libdbus-1-dev

      # `--locked` fails if Cargo.lock disagrees with the manifests, instead of
      # silently rewriting it. Without this, a version bump that forgets the
      # lockfile only surfaces as a dirty tree on someone's next local build.
      - name: Build
        run: cargo build --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The RDP helper is excluded from the workspace (IronRDP's dependency pins
      # cannot coexist with russh's), so nothing above touches it — until now it
      # was built only at release time, where a break lands too late to be cheap.
      # Windows only: it ships as adit-rdp-host.exe and has never been tried on
      # another target.
      - name: Build the RDP helper
        if: runner.os == 'Windows'
        run: cargo build --manifest-path crates/adit-rdp/Cargo.toml --locked

  smoke:
    name: smoke · launches headless (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Same set the build job installs, plus a virtual X server to open a window
      # on and Mesa's software Vulkan (lavapipe) so wgpu has an adapter to pick —
      # CI runners have no GPU.
      #
      # libxkbcommon-x11-0 is a *runtime* dependency, not a build one: winit
      # dlopens it, so the build job compiles happily without it and the app then
      # panics on startup. It has to be declared by any Linux package we ship.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgtk-3-dev libdbus-1-dev \
            xvfb mesa-vulkan-drivers libgl1-mesa-dri

      - name: Build the app
        run: cargo build -p adit-app --locked

      # Compiling proves nothing about starting up: adapter selection, window
      # creation and font loading all happen at runtime, and all three can fail
      # on a machine that built the binary happily. A GUI app has no run-and-exit
      # mode, so the test is that it is *still alive* after being given time to
      # get a window open. Exiting on its own means it crashed.
      # Run twice. The first pass is the real assertion: whatever renderer iced
      # picks, the app has to come up. The second forces Vulkan, because iced
      # falls back to the tiny-skia software renderer silently — so a green first
      # pass alone cannot tell "wgpu works" from "wgpu failed and nobody
      # noticed", and wgpu is what ships.
      - name: Launch headless
        env:
          RUST_BACKTRACE: '1'
        run: |
          launch() {
            local label="$1" log="$2"
            xvfb-run -a --server-args='-screen 0 1280x800x24' \
              target/debug/adit-app > "$log" 2>&1 &
            local pid=$!
            sleep 25
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              echo "$label: still up after 25s"
            else
              echo "::error::$label: adit-app exited on its own during startup"
              return 1
            fi
          }

          status=0
          launch 'default renderer' smoke-default.log || status=1
          WGPU_BACKEND=vulkan launch 'forced Vulkan' smoke-vulkan.log || status=1
          exit $status

      # Always shown, including on failure — the panic or adapter error lands
      # here, not in the step above.
      - name: Startup logs
        if: always()
        run: |
          for log in smoke-default.log smoke-vulkan.log; do
            echo "===== $log ====="
            cat "$log" 2>/dev/null || echo '(not produced)'
          done

  package-linux:
    name: package · deb installs and runs clean (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgtk-3-dev libdbus-1-dev

      - name: Build the app
        run: cargo build --release -p adit-app --locked

      # Hand-assembled rather than via cargo-deb: the dependency list is the
      # interesting part and it is worth stating explicitly, with the reason each
      # entry is there. The verification step below is what proves it right.
      - name: Assemble the .deb
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          root=pkgroot
          mkdir -p "$root/DEBIAN" "$root/usr/bin" \
                   "$root/usr/share/applications" \
                   "$root/usr/share/icons/hicolor/256x256/apps"

          install -m755 target/release/adit-app "$root/usr/bin/adit"
          install -m644 assets/icon.png "$root/usr/share/icons/hicolor/256x256/apps/adit.png"

          cat > "$root/usr/share/applications/adit.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Adit
          Comment=SSH / SFTP / RDP terminal client
          Exec=adit
          Icon=adit
          Terminal=false
          Categories=Network;RemoteAccess;
          DESKTOP

          # libxkbcommon-x11-0 is dlopened by winit, so it appears in no ELF
          # header and no automatic tool would find it — the smoke job caught it
          # only by running the binary. The rest back rfd (GTK), keyring (D-Bus),
          # winit (X11/Wayland) and wgpu (Vulkan loader). The `|` alternatives
          # cover Ubuntu 24.04's t64 library renaming.
          cat > "$root/DEBIAN/control" <<CONTROL
          Package: adit
          Version: $version
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Adit <noreply@example.com>
          Depends: libxkbcommon0, libxkbcommon-x11-0, libwayland-client0,
           libx11-6, libxcursor1, libxrandr2, libxi6,
           libgtk-3-0t64 | libgtk-3-0, libdbus-1-3, libvulkan1
          Description: SSH / SFTP / RDP terminal client
           A native terminal client with session groups, tabs, split panes,
           SFTP transfer and port forwarding.
          CONTROL

          dpkg-deb --build --root-owner-group "$root" "adit_${version}_amd64.deb"
          dpkg-deb --info "adit_${version}_amd64.deb"

      # The real test. Installing into a bare ubuntu image means apt has to
      # satisfy Depends on its own, with none of the -dev packages the build
      # steps above left lying around — so a missing entry fails here instead of
      # on a user's machine.
      - name: Install and run it in a clean container
        run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -eu -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq ./adit_*_amd64.deb xvfb >/dev/null
            xvfb-run -a --server-args="-screen 0 1280x800x24" adit > /w/pkg-smoke.log 2>&1 &
            pid=$!
            sleep 25
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              echo "installed adit stayed up; the dependency list is complete"
            else
              echo "::error::the installed adit exited on its own — Depends is incomplete or wrong"
              exit 1
            fi
          '

      - name: Package startup log
        if: always()
        run: cat pkg-smoke.log 2>/dev/null || echo '(not produced)'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adit-deb
          path: adit_*_amd64.deb
          if-no-files-found: warn

  package-macos:
    name: package · app bundle + dmg (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the app
        run: cargo build --release -p adit-app --locked

      - name: Assemble Adit.app
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app=Adit.app

          # macOS wants an .icns; build one from the single PNG we ship.
          mkdir -p adit.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/icon.png \
              --out "adit.iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size*2)) $((size*2)) assets/icon.png \
              --out "adit.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns adit.iconset -o adit.icns

          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/adit-app "$app/Contents/MacOS/adit"
          chmod +x "$app/Contents/MacOS/adit"
          cp adit.icns "$app/Contents/Resources/adit.icns"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Adit</string>
            <key>CFBundleDisplayName</key><string>Adit</string>
            <key>CFBundleIdentifier</key><string>com.github.weironz.adit</string>
            <key>CFBundleExecutable</key><string>adit</string>
            <key>CFBundleIconFile</key><string>adit.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          plutil -lint "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/adit"

      # GitHub's macOS runners have no dependable window session, so this may
      # well fail for reasons that say nothing about the app. Kept as a hard
      # assertion anyway: if it passes, macOS startup is proven the same way
      # Linux's is, and if it fails the log says whether the cause is a missing
      # display or a real crash. Delete it rather than let it flap.
      - name: Launch the bundle
        env:
          RUST_BACKTRACE: '1'
        run: |
          Adit.app/Contents/MacOS/adit > macos-smoke.log 2>&1 &
          pid=$!
          sleep 25
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
            echo "Adit.app stayed up; macOS startup is clean"
          else
            echo "::error::Adit.app exited on its own during startup"
            exit 1
          fi

      - name: Startup log
        if: always()
        run: cat macos-smoke.log 2>/dev/null || echo '(not produced)'

      # Unsigned and un-notarised: both need an Apple Developer account and
      # certificates that CI does not have. Gatekeeper will refuse to open this
      # by double-click until that exists, so it is a build artifact, not a
      # release artifact.
      - name: Build the dmg
        if: always()
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          hdiutil create -volname Adit -srcfolder Adit.app -ov -format UDZO \
            "adit_${version}_unsigned.dmg"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adit-macos-unsigned
          path: adit_*_unsigned.dmg
          if-no-files-found: warn

  integration:
    name: integration · real sshd (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # ubuntu-latest runners ship Docker; the test harness builds the throwaway
      # sshd image (docker/test-sshd) on first use and starts a container per test.
      - name: Integration tests
        run: cargo test -p adit-ssh --features integration -- --include-ignored --test-threads=4
