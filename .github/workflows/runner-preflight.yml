name: Self-hosted dependency inventory
on:
  push:
    branches: [codex/self-hosted-x64-ci]
    paths: [.github/workflows/runner-preflight.yml]
permissions:
  contents: read
jobs:
  windows:
    runs-on: [self-hosted, Windows, X64, home-workstation, repo-adit]
    timeout-minutes: 10
    steps:
      - name: Inventory Windows build prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tools=@{}
          foreach($tool in @('git','rustup','rustc','cargo','pwsh','just','cmake','nasm','bash','cl','link')){
            $command=Get-Command $tool -ErrorAction SilentlyContinue
            $tools[$tool]=if($command){$command.Source}else{$null}
          }
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=if(Test-Path $vswhere){& $vswhere -all -products '*' -format json | ConvertFrom-Json}else{@()}
          [ordered]@{runner=$env:RUNNER_NAME;tools=$tools;visual_studio=@($vs|Select-Object installationPath,installationVersion);sdk=@(Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Lib' -ErrorAction SilentlyContinue|Select-Object -ExpandProperty Name);free_gib=[math]::Round((Get-PSDrive C).Free/1GB,1)}|ConvertTo-Json -Depth 6
  linux:
    runs-on: [self-hosted, Linux, X64, home-workstation, repo-adit]
    timeout-minutes: 10
    steps:
      - name: Inventory Linux build prerequisites
        shell: bash
        run: |
          set -eu
          uname -sm
          for tool in git rustup rustc cargo docker gcc pkg-config Xvfb Xtigervnc x11vnc rpm; do
            command -v "$tool" || true
          done
          sudo -n true && echo 'sudo_available=true' || echo 'sudo_available=false'
          docker info --format 'docker={{.ServerVersion}}'
          dpkg-query -W -f='${Package} ${Status}\n' build-essential libxkbcommon-dev libwayland-dev libx11-dev libgtk-3-dev libdbus-1-dev python3-tk 2>/dev/null || true
          df -h .
