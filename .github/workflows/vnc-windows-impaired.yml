name: VNC Windows guest-egress impaired acceptance

on:
  workflow_dispatch:
  push:
    branches: ['codex/vnc-windows-shared-soak']
    paths:
      - '.github/workflows/vnc-windows-impaired.yml'
      - 'tests/vnc/netem-guest/**'
      - 'tests/vnc/windows-server-smoke.ps1'
      - 'tests/vnc/windows-load.py'
      - 'crates/adit-session/examples/vnc_probe.rs'
      - 'crates/adit-session/src/vnc_client.rs'
      - 'crates/adit-vnc/**'

permissions:
  contents: read

jobs:
  guest:
    name: Build same-source auditable packet guest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assemble verified guest
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cpio kmod
          timeout --signal=TERM --kill-after=10s 420s bash tests/vnc/netem-guest/build.sh "$RUNNER_TEMP/adit-netem-guest"
      - name: Preserve every build outcome and package closure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnc-impaired-guest
          path: |
            ${{ runner.temp }}/adit-netem-guest/vmlinuz-virt
            ${{ runner.temp }}/adit-netem-guest/initramfs.cpio.gz
            ${{ runner.temp }}/adit-netem-guest/manifest.json
            ${{ runner.temp }}/adit-netem-guest/sources.json
            ${{ runner.temp }}/adit-netem-guest/package-versions.txt
            ${{ runner.temp }}/adit-netem-guest/modules.dep
            ${{ runner.temp }}/adit-netem-guest/apks/
          if-no-files-found: warn
          retention-days: 14
  narrow:
    name: One real lossless/static VNC gate after same-QEMU calibration
    needs: guest
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
      ADIT_VNC_TRACE_FLOW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: vnc-impaired-guest
          path: ${{ runner.temp }}/adit-netem-guest
      - name: Build current production SessionManager probe
        shell: pwsh
        run: |
          cargo build -p adit-session --example vnc_probe --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Calibrate and test one VNC sample plus explicit wrong auth and restored baseline
        timeout-minutes: 9
        shell: pwsh
        run: ./tests/vnc/netem-guest/windows.ps1 -Guest "$env:RUNNER_TEMP/adit-netem-guest" -Results "$env:RUNNER_TEMP/adit-vnc-impaired" -Mode vnc -Probe ./target/debug/examples/vnc_probe.exe -Samples 1 -Quality lossless -Workload static
      - name: Preserve original gate success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnc-impaired-narrow
          path: |
            ${{ runner.temp }}/adit-vnc-impaired/
            ${{ runner.temp }}/adit-netem-qemu-tools/provenance.json
            ${{ runner.temp }}/adit-netem-qemu-tools/extraction.txt
            ${{ runner.temp }}/adit-netem-qemu-tools/qemu-version.txt
          if-no-files-found: warn
          retention-days: 14
  matrix:
    name: Guest egress90ms/5mbit/0.1% (${{ matrix.quality }}, ${{ matrix.workload }})
    needs: [guest, narrow]
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        quality: [lossless, wan]
        workload: [static, scroll, drag]
    env:
      CARGO_BUILD_JOBS: 2
      ADIT_VNC_TRACE_FLOW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: vnc-impaired-guest
          path: ${{ runner.temp }}/adit-netem-guest
      - name: Build current production SessionManager probe
        shell: pwsh
        run: |
          cargo build -p adit-session --example vnc_probe --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Calibrate then ten matched baseline and impaired VNC sessions and restored baseline
        timeout-minutes: 15
        shell: pwsh
        run: ./tests/vnc/netem-guest/windows.ps1 -Guest "$env:RUNNER_TEMP/adit-netem-guest" -Results "$env:RUNNER_TEMP/adit-vnc-impaired" -Mode vnc -Probe ./target/debug/examples/vnc_probe.exe -Samples 10 -Quality '${{ matrix.quality }}' -Workload '${{ matrix.workload }}'
      - name: Preserve every original matrix outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnc-impaired-${{ matrix.quality }}-${{ matrix.workload }}
          path: |
            ${{ runner.temp }}/adit-vnc-impaired/
            ${{ runner.temp }}/adit-netem-qemu-tools/provenance.json
            ${{ runner.temp }}/adit-netem-qemu-tools/extraction.txt
            ${{ runner.temp }}/adit-netem-qemu-tools/qemu-version.txt
          if-no-files-found: warn
          retention-days: 14
